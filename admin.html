<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b202b">
  <title>الإدارة | أكاديمية جولدن بوي</title>
  <link rel="stylesheet" href="index.css">
  <link rel="icon" type="image/jpeg" href="assets/golden-boy-logo.jpeg">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="supabase-config.js"></script>
  <script defer src="admin.js"></script>
</head>
<body>
  <header class="site-header"><div class="container header-inner">
    <a class="brand" href="index.html" aria-label="العودة إلى الموقع"><span class="brand-mark"><img src="assets/golden-boy-logo.jpeg" alt=""></span><span class="brand-copy"><strong>GOLDEN BOY</strong><span>ADMIN PORTAL</span></span></a>
    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="تبديل المظهر">☀</button>
      <button class="language-toggle" id="language-toggle" type="button">EN / ع</button>
      <a class="button button-ghost button-small" href="index.html">الموقع العام</a>
    </div>
  </div></header>
  <main>
    <section class="page-hero"><div class="container"><p class="eyebrow" data-ar="مساحة خاصة" data-en="PRIVATE ADMIN AREA">مساحة خاصة</p><h1 data-ar="إدارة الأكاديمية <span>والطلبات.</span>" data-en="Academy admin <span>portal.</span>">إدارة الأكاديمية <span>والطلبات.</span></h1><p data-ar="تسجيل الدخول وحده لا يكفي؛ يجب أن يكون الحساب معتمدًا كمدير من قاعدة Supabase." data-en="Signing in is not enough; the account must be explicitly authorized as an admin in Supabase.">تسجيل الدخول وحده لا يكفي؛ يجب أن يكون الحساب معتمدًا كمدير من قاعدة Supabase.</p></div></section>
    <section class="section"><div class="container">
      <section class="panel auth-panel" id="admin-auth-panel">
        <div class="panel-heading"><div><p class="eyebrow" data-ar="دخول الإدارة" data-en="ADMIN SIGN IN">دخول الإدارة</p><h2 data-ar="دخول أو إنشاء حساب" data-en="Sign in or create an account">دخول أو إنشاء حساب</h2></div></div>
        <form id="admin-auth-form">
          <div class="form-grid">
            <label><span data-ar="البريد الإلكتروني" data-en="Email">البريد الإلكتروني</span><input name="email" type="email" autocomplete="username" required></label>
            <label><span data-ar="كلمة المرور" data-en="Password">كلمة المرور</span><input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
          </div>
          <div class="auth-actions"><button class="button button-primary" type="submit" data-ar="دخول" data-en="Sign in">دخول</button><button class="button button-ghost" id="admin-register" type="button" data-ar="إنشاء حساب" data-en="Register">إنشاء حساب</button></div>
        </form>
        <p class="form-message" id="admin-auth-message" role="status" hidden></p>
        <button class="status-action" id="admin-signout-auth" type="button" hidden data-ar="تسجيل الخروج" data-en="Sign out">تسجيل الخروج</button>
      </section>
      <section id="admin-dashboard" hidden>
        <div class="application-toolbar"><div><h2 data-ar="طلبات التسجيل" data-en="Applications">طلبات التسجيل</h2><p class="muted" id="application-count"></p></div><button class="button button-ghost button-small" id="admin-signout" type="button" data-ar="تسجيل الخروج" data-en="Sign out">تسجيل الخروج</button></div>
        <div class="schedule-filters">
          <label><span data-ar="الحالة" data-en="Status">الحالة</span><select id="application-status-filter"><option value="">كل الحالات</option><option value="pending">قيد المراجعة</option><option value="approved">مقبول</option><option value="rejected">مرفوض</option></select></label>
          <label><span data-ar="اللعبة" data-en="Sport">اللعبة</span><select id="application-sport-filter"><option value="">كل الألعاب</option></select></label>
          <label><span data-ar="بحث بالاسم أو الهاتف" data-en="Search name or phone">بحث بالاسم أو الهاتف</span><input id="application-search" type="search"></label>
        </div>
        <div id="applications-list" class="application-list"></div>
      </section>
    </div></section>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><span class="footer-copy">Golden Boy Academy • Admin portal</span><a class="text-link" href="index.html">العودة للموقع العام</a></div></footer>
</body>
</html>
